<div class="card mb-2" id="task-{{ task.id }}">
    <div class="card-body d-flex justify-content-between align-items-center">
        <div class="text-break" style="min-width: 0;">
            <h5 class="card-title mb-1">{{ task.title }}</h5>
            <p class="text-muted mb-0">{{ task.description }}</p>
        </div>
        <div class="d-flex gap-2 align-items-center flex-shrink-0">
            {% if task.is_done %}
                <span class="badge bg-success">Выполнено <i class="bi bi-check-circle-fill"></i></span>
            {% else %}
                <span class="badge bg-secondary">В работе <i class="bi bi-hourglass-split"></i></span>
            {% endif %}
            <div class="d-flex align-items-center gap-3">
                <a href="{% url 'tasks:task_edit' task.id %}" class="btn btn-sm btn-outline-success">Изменить</a>
                <button class="btn btn-sm btn-outline-primary"
                        hx-post="{% url 'tasks:task_toggle' task.id %}"
                        hx-target="#task-{{ task.id }}"
                        hx-swap="outerHTML"
                        hx-vals='{"date": "{{ selected_date|date:"Y-m-d" }}"}'>
                    Переключить
                </button>

                <button type="button" class="btn btn-sm btn-outline-danger"
                        data-bs-toggle="modal" data-bs-target="#deleteModal{{ task.id }}">
                    Удалить
                </button>

                <div class="modal fade" id="deleteModal{{ task.id }}" tabindex="-1">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title">Подтверждение</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
                            </div>
                            <div class="modal-body">Удалить задачу «{{ task.title }}»?</div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                                <form method="post" action="{% url 'tasks:task_delete' task.id %}">
                                    {% csrf_token %}
                                    <input type="hidden" name="date" value="{{ selected_date|date:'Y-m-d' }}">
                                    <button type="submit" class="btn btn-danger"><i class="bi bi-trash"></i> Удалить</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
